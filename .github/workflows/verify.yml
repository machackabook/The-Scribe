name: Verify Scribe
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-and-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-14
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/test-core.cjs
      - run: python3 scribe.py build-pages --output site
      - run: python3 scripts/check_pages.py site
