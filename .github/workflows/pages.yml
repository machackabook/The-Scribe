name: Publish Scribe interface
'on':
  workflow_dispatch:
    inputs:
      approve_public_shell:
        description: Publish the interface publicly, with no private archive or Drive tokens
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: scribe-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.approve_public_shell
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/test-core.cjs
      - run: python3 scribe.py build-pages --output site
      - run: python3 scripts/check_pages.py site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish interface
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
